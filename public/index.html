<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PICKIT — Curated Everyday Gear & Fast US Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <!-- Top Announcement Bar -->
  <div class="bg-slate-900 text-white text-xs text-center py-2 px-4 tracking-wide">
    🇺🇸 Fast US Shipping Available &bull; Tracked Delivery on Every Order
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <a href="/" class="text-2xl font-black tracking-tight text-slate-900">PICK<span class="text-emerald-600">IT</span></a>
      <div class="flex-1 max-w-xl">
        <input id="searchInput" type="search" placeholder="Search 2,830+ gadgets, desk setup, home & gaming gear..."
          class="w-full rounded-full border border-slate-300 bg-slate-100 px-4 py-2 text-sm focus:bg-white focus:border-emerald-600 focus:outline-none" />
      </div>
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-2 text-xs font-medium text-slate-700 cursor-pointer select-none">
          <input id="usOnlyToggle" type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500" />
          🇺🇸 US Stock Only
        </label>
        <button id="cartBtn" class="relative rounded-full bg-slate-900 text-white px-4 py-2 text-sm font-semibold hover:bg-slate-800">
          Cart (<span id="cartCount">0</span>)
        </button>
      </div>
    </div>
    <!-- Category Filter Pills -->
    <div id="categoryBar" class="max-w-7xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto text-xs font-medium">
      <button data-cat="" class="cat-pill shrink-0 px-3 py-1.5 rounded-full bg-slate-900 text-white">All Products</button>
      <button data-cat="Desk Setup Products" class="cat-pill shrink-0 px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">Desk Setup</button>
      <button data-cat="Gaming Accessories" class="cat-pill shrink-0 px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">Gaming Accessories</button>
      <button data-cat="Home & Kitchen Gadgets" class="cat-pill shrink-0 px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">Home &amp; Kitchen</button>
      <button data-cat="Featured" class="cat-pill shrink-0 px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">Featured</button>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-4">
      <p id="resultMeta" class="text-sm text-slate-500">Loading catalog...</p>
    </div>
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5"></div>
    <div id="loadMoreWrap" class="mt-8 text-center hidden">
      <button id="loadMoreBtn" class="rounded-full bg-slate-900 text-white px-8 py-3 text-sm font-semibold hover:bg-emerald-600 transition">
        Load More Products
      </button>
    </div>
  </main>

  <!-- Slide-out Cart Drawer -->
  <div id="cartDrawer" class="fixed inset-0 z-50 hidden">
    <div id="cartBackdrop" class="absolute inset-0 bg-black/40"></div>
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col">
      <div class="p-4 border-b flex items-center justify-between">
        <h2 class="text-lg font-bold">Your PICKIT Cart</h2>
        <button id="closeCart" class="text-slate-500 hover:text-slate-900 text-xl">&times;</button>
      </div>
      <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
      <div class="p-4 border-t bg-slate-50 space-y-3">
        <div class="flex justify-between font-bold text-base">
          <span>Subtotal</span>
          <span id="cartSubtotal">$0.00</span>
        </div>
        <p class="text-xs text-slate-500">Shipping ($3.99 Standard / $6.99 Priority / $13.99 Express) calculated at Shopify checkout.</p>
        <button id="checkoutBtn" class="w-full rounded-xl bg-emerald-600 text-white py-3 font-bold text-sm hover:bg-emerald-700 disabled:opacity-50">
          Proceed to Secure Checkout &rarr;
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.hostname.endsWith("trycloudflare.com")) ? "" : "https://api.pickitcart.com";
    const PAGE_SIZE = 48;
    let state = { q: "", category: "", usOnly: false, page: 1, totalHits: 0, products: [], cart: JSON.parse(localStorage.getItem("pickit_cart") || "[]") };

    const saveCart = () => { localStorage.setItem("pickit_cart", JSON.stringify(state.cart)); renderCart(); };

    async function fetchProducts(append = false) {
      if (!append) state.page = 1;
      const loadBtn = document.getElementById("loadMoreBtn");
      loadBtn.disabled = true;
      loadBtn.textContent = "Loading...";

      const params = new URLSearchParams();
      if (state.q) params.set("q", state.q);
      if (state.category) params.set("category", state.category);
      if (state.usOnly) params.set("usStock", "true");
      params.set("page", String(state.page));
      params.set("limit", String(PAGE_SIZE));

      const res = await fetch(API_BASE + "/api/search?" + params.toString());
      const data = await res.json();
      const incoming = data.hits || data.products || [];
      state.totalHits = data.totalHits ?? incoming.length;
      state.products = append ? state.products.concat(incoming) : incoming;
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      const total = Math.max(state.totalHits, state.products.length);
      document.getElementById("resultMeta").textContent = `Showing ${state.products.length} of ${total.toLocaleString()} items`;

      grid.innerHTML = state.products.map((p, idx) => {
        const price = Number(p.retail_price || p.price || 19.99).toFixed(2);
        const img = p.main_image || (p.images && p.images[0]) || "https://via.placeholder.com/400?text=PICKIT";
        return `
          <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition">
            <div class="relative aspect-square bg-slate-100 overflow-hidden">
              <img src="${img}" alt="${(p.title || "").replace(/"/g, "&quot;")}" loading="lazy" class="w-full h-full object-cover" />
              ${p.us_stock ? '<span class="absolute top-2 left-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">🇺🇸 US Fast Ship</span>' : '<span class="absolute top-2 left-2 bg-slate-900/80 text-white text-[10px] font-medium px-2 py-0.5 rounded-full">Tracked Air</span>'}
            </div>
            <div class="p-3.5 flex-1 flex flex-col justify-between gap-3">
              <div>
                <p class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">${p.category || "Trending"}</p>
                <h3 class="text-sm font-semibold text-slate-800 line-clamp-2 mt-0.5">${p.title || "PICKIT Item"}</h3>
              </div>
              <div class="space-y-2">
                <div class="flex items-baseline justify-between">
                  <span class="text-lg font-extrabold text-slate-900">$${price}</span>
                  <span class="text-xs text-amber-500 font-semibold">★ ${p.rating || "4.8"}</span>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                  <button onclick="addToCart(${idx})" class="rounded-lg border border-slate-300 py-1.5 text-xs font-semibold hover:bg-slate-100">+ Add Cart</button>
                  <button onclick="buyNow(${idx})" class="rounded-lg bg-slate-900 text-white py-1.5 text-xs font-semibold hover:bg-emerald-600 transition">Buy Now</button>
                </div>
              </div>
            </div>
          </div>`;
      }).join("");

      const wrap = document.getElementById("loadMoreWrap");
      const btn = document.getElementById("loadMoreBtn");
      const remaining = total - state.products.length;
      if (remaining > 0) {
        wrap.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = `Load More (${remaining.toLocaleString()} more available)`;
      } else {
        wrap.classList.add("hidden");
      }
    }

    function addToCart(idx) {
      const p = state.products[idx];
      if (!p) return;
      const existing = state.cart.find(item => item.source_pid === p.source_pid);
      if (existing) existing.qty += 1;
      else state.cart.push({ ...p, qty: 1 });
      saveCart();
      document.getElementById("cartDrawer").classList.remove("hidden");
    }

    function updateQty(pid, delta) {
      const idx = state.cart.findIndex(i => i.source_pid === pid);
      if (idx === -1) return;
      state.cart[idx].qty += delta;
      if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
      saveCart();
    }

    function renderCart() {
      const count = state.cart.reduce((s, i) => s + i.qty, 0);
      const sub = state.cart.reduce((s, i) => s + Number(i.retail_price || i.price || 19.99) * i.qty, 0);
      document.getElementById("cartCount").textContent = count;
      document.getElementById("cartSubtotal").textContent = "$" + sub.toFixed(2);
      const container = document.getElementById("cartItems");
      if (!state.cart.length) {
        container.innerHTML = '<p class="text-sm text-slate-400 text-center py-12">Your cart is empty.</p>';
        return;
      }
      container.innerHTML = state.cart.map(item => `
        <div class="flex gap-3 items-center border-b pb-3">
          <img src="${item.main_image || ""}" class="w-16 h-16 rounded-lg object-cover bg-slate-100" />
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold truncate">${item.title}</p>
            <p class="text-xs text-slate-500">$${Number(item.retail_price || item.price || 19.99).toFixed(2)}</p>
            <div class="flex items-center gap-2 mt-1">
              <button onclick="updateQty('${item.source_pid}', -1)" class="w-6 h-6 rounded border text-xs">-</button>
              <span class="text-xs font-bold">${item.qty}</span>
              <button onclick="updateQty('${item.source_pid}', 1)" class="w-6 h-6 rounded border text-xs">+</button>
            </div>
          </div>
        </div>`).join("");
    }

    async function buyNow(idx) {
      const p = state.products[idx];
      if (!p) return;
      await startCheckout([{ ...p, qty: 1 }]);
    }

    async function startCheckout(items) {
      const btn = document.getElementById("checkoutBtn");
      btn.disabled = true; btn.textContent = "Creating Secure Shopify Checkout...";
      try {
        const pairs = [];
        for (const it of items) {
          let numId = String(it.variants?.[0]?.shopify_variant_id || "").split("/").pop();
          if (!numId || numId.startsWith("DRY_")) {
            const pid = it.source_pid || it.id || it.pid;
            const res = await fetch(API_BASE + "/api/jit-cart", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ productId: pid })
            });
            const data = await res.json();
            const gid = data?.item?.shopify_variant_id || "";
            numId = String(gid).split("/").pop();
            if (!numId || numId.startsWith("DRY_")) throw new Error(data.error || "Variant sync failed: " + JSON.stringify(data));
          }
          pairs.push(numId + ":" + (it.qty || 1));
        }
        window.location.href = "https://h1fecw-jq.myshopify.com/cart/" + pairs.join(",");
      } catch (e) {
        alert("Checkout error: " + e.message);
      } finally {
        btn.disabled = false; btn.textContent = "Proceed to Secure Checkout →";
      }
    }

    let searchTimer;
    document.getElementById("searchInput").addEventListener("input", e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { state.q = e.target.value; fetchProducts(false); }, 180);
    });
    document.getElementById("usOnlyToggle").addEventListener("change", e => { state.usOnly = e.target.checked; fetchProducts(false); });
    document.querySelectorAll(".cat-pill").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".cat-pill").forEach(b => { b.classList.remove("bg-slate-900", "text-white"); b.classList.add("bg-slate-100", "text-slate-700"); });
      btn.classList.add("bg-slate-900", "text-white"); btn.classList.remove("bg-slate-100", "text-slate-700");
      state.category = btn.dataset.cat;
      fetchProducts(false);
    }));
    document.getElementById("loadMoreBtn").onclick = () => { state.page += 1; fetchProducts(true); };
    document.getElementById("cartBtn").onclick = () => document.getElementById("cartDrawer").classList.remove("hidden");
    document.getElementById("closeCart").onclick = () => document.getElementById("cartDrawer").classList.add("hidden");
    document.getElementById("cartBackdrop").onclick = () => document.getElementById("cartDrawer").classList.add("hidden");
    document.getElementById("checkoutBtn").onclick = () => { if (state.cart.length) startCheckout(state.cart); };

    renderCart();
    fetchProducts(false);
  </script>
</body>
</html>
